params:
  - animals/params.yaml

metrics:
  - animals/dvclive/metrics.json

plots:
  - animals/dvclive/plots/metrics/train_loss.tsv:
      x: step
      y: train_loss
      title: Train Loss

  - animals/dvclive/plots/metrics/train_accuracy.tsv:
      x: step
      y: train_accuracy
      title: Train Accuracy

  - animals/dvclive/plots/metrics/test_loss.tsv:
      x: step
      y: test_loss
      title: Test Loss

  - animals/dvclive/plots/metrics/test_accuracy.tsv:
      x: step
      y: test_accuracy
      title: Test Accuracy

artifacts:
  confusion:
    path: animals/*_confusion.csv
    type: table
